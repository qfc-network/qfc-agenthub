services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agenthub
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: agenthub_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://agenthub:agenthub_dev@db:5432/agenthub
      PORT: "3100"
      HOST: "0.0.0.0"
      GITHUB_WEBHOOK_SECRET: ""
      GITHUB_TOKEN: ""
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
